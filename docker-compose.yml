version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fnv_app
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      SITE_NAME: ${SITE_NAME:-FNV Heerenveen}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-info@fnvheerenveen.nl}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fnv_heerenveen}
      DB_USER: ${DB_USER:-fnv}
      DB_PASS: ${DB_PASS:-fnv_dev_password}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fnv-network

  db:
    image: mysql:8.4
    container_name: fnv_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fnv_heerenveen}
      MYSQL_USER: ${MYSQL_USER:-fnv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fnv_dev_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-root_password_change_me}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - fnv-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5
    container_name: fnv_phpmyadmin
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fnv-network

volumes:
  db_data:

networks:
  fnv-network:
    driver: bridge
